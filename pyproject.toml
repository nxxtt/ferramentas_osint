[tool.uv]
required-version = ">=0.12.1"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=auto -n auto"
filterwarnings = [
    "ignore::jwt.InsecureKeyLengthWarning",
]
markers = [
    "real_sleep: teste que precisa de asyncio.sleep real (nao mockado)",
    "slow: teste que demora mais que 1s para executar",
    "network: teste que pode fazer conexoes reais (HTTP, DNS, SSL)",
    "smoke: sanity check rapido (parser, imports, data load)",
    "integration: teste que valida multiplos componentes juntos",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "PERF","ASYNC","LOG","G"]
ignore = ["E501", "RUF001", "RUF002", "ASYNC109"]

[tool.basedpyright]
pythonVersion = "3.14"
exclude = ["**/__pycache__", "**/node_modules", ".git", ".venv"]
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false
useLibraryCodeForTypes = true
reportMissingModuleSource = false

[tool.coverage.run]
source = ["mytools"]
branch = true
omit = ["tests/*", "src/mytools/data/*"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100

[tool.coverage.html]
directory = "htmlcov"
